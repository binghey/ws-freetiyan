<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速导航 - 您的上网起点</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #4a6cf7;
            --primary-light: #6a89ff;
            --secondary: #6c757d;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #28a745;
            --card-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-right: 10px;
        }
        
        .logo h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark);
        }
        
        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 5px 15px var(--shadow);
            transition: all 0.3s ease;
        }
        
        .search-box:focus {
            outline: none;
            box-shadow: 0 5px 20px rgba(74, 108, 247, 0.3);
        }
        
        .search-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            background: var(--primary-light);
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .category-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px var(--shadow);
        }
        
        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .category-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        
        .category-icon i {
            color: white;
            font-size: 1.2rem;
        }
        
        .category-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
        }
        
        .links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        
        .link-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--dark);
        }
        
        .link-item:hover {
            background: rgba(74, 108, 247, 0.08);
            color: var(--primary);
        }
        
        .link-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(74, 108, 247, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: var(--primary);
        }
        
        .link-text {
            flex: 1;
        }
        
        .link-name {
            font-weight: 500;
            margin-bottom: 3px;
        }
        
        .link-desc {
            font-size: 0.85rem;
            color: var(--secondary);
        }
        
        .quick-links {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px var(--shadow);
            margin-bottom: 40px;
        }
        
        .quick-links-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .quick-links-title i {
            margin-right: 10px;
            color: var(--primary);
        }
        
        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .quick-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.2s ease;
        }
        
        .quick-link:hover {
            background: rgba(74, 108, 247, 0.08);
            transform: scale(1.05);
        }
        
        .quick-link-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(74, 108, 247, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: var(--primary);
        }
        
        .quick-link-name {
            font-weight: 500;
            font-size: 0.9rem;
            text-align: center;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--secondary);
            font-size: 0.9rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .categories {
                grid-template-columns: 1fr;
            }
            
            .quick-links-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-compass"></i>
                <h1>快速导航</h1>
            </div>
            <p class="subtitle">高效上网，从这开始</p>
            
            <div class="search-container">
                <input type="text" class="search-box" placeholder="搜索网站或输入网址...">
                <button class="search-btn">搜索</button>
            </div>
        </header>
        
        <main>
            <div class="categories">
                <div class="category-card">
                    <div class="category-header">
                        <div class="category-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <h2 class="category-title">搜索引擎</h2>
                    </div>
                    <div class="links">
                        <a href="https://www.google.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fab fa-google"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">Google</div>
                                <div class="link-desc">全球最受欢迎的搜索引擎</div>
                            </div>
                        </a>
                        <a href="https://www.bing.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fab fa-microsoft"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">Bing</div>
                                <div class="link-desc">微软推出的搜索引擎</div>
                            </div>
                        </a>
                        <a href="https://www.baidu.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-paw"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">百度</div>
                                <div class="link-desc">中文搜索引擎</div>
                            </div>
                        </a>
                    </div>
                </div>
                
                <div class="category-card">
                    <div class="category-header">
                        <div class="category-icon">
                            <i class="fas fa-newspaper"></i>
                        </div>
                        <h2 class="category-title">资讯媒体</h2>
                    </div>
                    <div class="links">
                        <a href="https://news.sina.com.cn" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-globe"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">新浪新闻</div>
                                <div class="link-desc">全面及时的新闻资讯</div>
                            </div>
                        </a>
                        <a href="https://www.163.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-network-wired"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">网易</div>
                                <div class="link-desc">综合性门户网站</div>
                            </div>
                        </a>
                        <a href="https://www.qq.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fab fa-qq"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">腾讯网</div>
                                <div class="link-desc">中国最大的门户网站</div>
                            </div>
                        </a>
                    </div>
                </div>
                
                <div class="category-card">
                    <div class="category-header">
                        <div class="category-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <h2 class="category-title">购物电商</h2>
                    </div>
                    <div class="links">
                        <a href="https://www.taobao.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-shopping-bag"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">淘宝</div>
                                <div class="link-desc">阿里巴巴旗下购物平台</div>
                            </div>
                        </a>
                        <a href="https://www.jd.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-archive"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">京东</div>
                                <div class="link-desc">自营式电商企业</div>
                            </div>
                        </a>
                        <a href="https://www.amazon.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fab fa-amazon"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">亚马逊</div>
                                <div class="link-desc">全球知名电商平台</div>
                            </div>
                        </a>
                    </div>
                </div>
                
                <div class="category-card">
                    <div class="category-header">
                        <div class="category-icon">
                            <i class="fas fa-video"></i>
                        </div>
                        <h2 class="category-title">视频娱乐</h2>
                    </div>
                    <div class="links">
                        <a href="https://www.youtube.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fab fa-youtube"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">YouTube</div>
                                <div class="link-desc">全球视频分享平台</div>
                            </div>
                        </a>
                        <a href="https://www.bilibili.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-play-circle"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">哔哩哔哩</div>
                                <div class="link-desc">中国年轻人文化社区</div>
                            </div>
                        </a>
                        <a href="https://www.netflix.com" target="_blank" class="link-item">
                            <div class="link-icon">
                                <i class="fas fa-film"></i>
                            </div>
                            <div class="link-text">
                                <div class="link-name">Netflix</div>
                                <div class="link-desc">全球流媒体平台</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="quick-links">
                <h2 class="quick-links-title"><i class="fas fa-bolt"></i> 常用网站</h2>
                <div class="quick-links-grid">
                    <a href="https://mail.google.com" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="quick-link-name">Gmail</div>
                    </a>
                    <a href="https://drive.google.com" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fas fa-cloud"></i>
                        </div>
                        <div class="quick-link-name">Google Drive</div>
                    </a>
                    <a href="https://github.com" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="quick-link-name">GitHub</div>
                    </a>
                    <a href="https://www.notion.so" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fas fa-sticky-note"></i>
                        </div>
                        <div class="quick-link-name">Notion</div>
                    </a>
                    <a href="https://calendar.google.com" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <div class="quick-link-name">日历</div>
                    </a>
                    <a href="https://translate.google.com" target="_blank" class="quick-link">
                        <div class="quick-link-icon">
                            <i class="fas fa-language"></i>
                        </div>
                        <div class="quick-link-name">翻译</div>
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2023 快速导航 | 设计简洁，使用便捷</p>
        </footer>
    </div>

    <script>
        // 简单的搜索功能
        document.querySelector('.search-btn').addEventListener('click', function() {
            const query = document.querySelector('.search-box').value.trim();
            if (query) {
                if (query.includes('.') && !query.includes(' ')) {
                    // 如果输入看起来像网址
                    if (!query.startsWith('http://') && !query.startsWith('https://')) {
                        window.open('https://' + query, '_blank');
                    } else {
                        window.open(query, '_blank');
                    }
                } else {
                    // 否则作为搜索查询
                    window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
                }
            }
        });
        
        // 按回车键也可以搜索
        document.querySelector('.search-box').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>
